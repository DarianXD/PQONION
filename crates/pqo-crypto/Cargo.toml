[package]
name = "pqo-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Nucleu criptografic pentru platforma de comunicatii anonime post-cuantice"

[features]
default = []
# Activeaza ML-KEM-768 real. Necesita Rust >= 1.81.
pq = ["dep:ml-kem", "dep:ml-dsa"]

[dependencies]
sha3         = { version = "0.10", default-features = false }
aes          = { version = "0.8", default-features = false }
ed25519-dalek = { version = "2.1", default-features = false, features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize", "precomputed-tables"] }
subtle       = { version = "2", default-features = false }
zeroize      = { version = "1.8", default-features = false, features = ["zeroize_derive"] }
rand_core    = { version = "0.6", default-features = false }
ml-kem       = { version = "0.2", optional = true }
ml-dsa       = { version = "0.0.4", optional = true }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
